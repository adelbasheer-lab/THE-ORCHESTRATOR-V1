name: Build Android Local Uploader

on:
  workflow_dispatch:
  push:
    paths:
      - "android-uploader/**"
      - ".github/workflows/build-android-uploader.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-uploader

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-local-uploader-debug-apk
          path: android-uploader/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
